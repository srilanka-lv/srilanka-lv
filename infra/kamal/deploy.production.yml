service: srilanka-production

servers:
  web:
    hosts:
      - <%= ENV['HETZNER_HOST'] %>

proxy:
  host: srilanka.lv
  ssl:
    certificate_pem: KAMAL_PROXY_TLS_CERT
    private_key_pem: KAMAL_PROXY_TLS_KEY

env:
  clear:
    NEXT_PUBLIC_SELF_URL: https://srilanka.lv
    NEXT_PUBLIC_SANITY_STUDIO_DATASET: production
    SENTRY_ENVIRONMENT: production
