service: srilanka

image: srilanka-lv/srilanka-lv

# CI builds and pushes the image. Kamal only pulls + deploys with --skip-push.
# The arch must match what CI builds (linux/amd64 in docker-publish step).
builder:
  arch: amd64

registry:
  server: ghcr.io
  username: davevanhoorn
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

# Shared runtime env. Per-destination overrides live in
# config/deploy.<destination>.yml.
#
# Non-secret values use `env.clear:` and resolve via ENV.fetch — missing values
# fail loudly at config-load time instead of silently producing empty strings.
# In CI, the values come from GitHub repo/environment variables (vars.*); locally
# from sourced .kamal/.env.<destination> files.
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: 0.0.0.0
    SENTRY_RELEASE: <%= ENV.fetch('VERSION') %>
    NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID: <%= ENV.fetch('NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID') %>
    RESEND_AUDIENCE_ID: <%= ENV.fetch('RESEND_AUDIENCE_ID') %>
  secret:
    - SANITY_API_KEY
    - RESEND_API_KEY
    - SERPAPI_API_KEY

# kamal-proxy boots the new container, waits for /api/up to return 200,
# then atomically switches traffic.
proxy:
  app_port: 3000
  healthcheck:
    path: /api/up
    interval: 3
    timeout: 30
