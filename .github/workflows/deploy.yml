name: Build and deploy

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - build
          - deploy
        default: build
      destination:
        description: Destination
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: For action=build, the BASE version (will be suffixed with -<destination> in the image tag). For action=deploy, the FULL existing image tag to deploy. Defaults to HEAD SHA.
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ====================================================================
  # DEVELOPMENT FLOW
  # Push to `development` → build with SHA tag → deploy to development env
  # ====================================================================

  build-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    # Reference the development environment so vars.NEXT_PUBLIC_* resolve
    # to development values (baked into the image at build time).
    environment: development
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=development

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-development

  deploy-development:
    needs: build-development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: development
      version: ${{ needs.build-development.outputs.version }}
    secrets: inherit

  # ====================================================================
  # MAIN / RELEASE FLOW
  # Push to `main` → release-please. If a release PR is merged →
  #   build staging + production images in parallel (each with its own
  #   service label and per-env NEXT_PUBLIC_* values), then deploy
  #   staging → (approval) → deploy production.
  # ====================================================================

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  build-staging:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Use the staging environment so vars.NEXT_PUBLIC_* resolve to staging values.
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-please.outputs.tag_name }}-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}-staging
            type=raw,value=staging

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-staging

  build-production:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Use the production environment so vars.NEXT_PUBLIC_* resolve to production
    # values. Side effect: production env's Required Reviewers rule gates the
    # build — releases pause once for approval at this step.
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-please.outputs.tag_name }}-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}-production
            type=raw,value=production

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-production

  deploy-staging:
    needs: [release-please, build-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: staging
      version: ${{ needs.build-staging.outputs.version }}
      sentry_release: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  deploy-production:
    needs: [release-please, build-production, deploy-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: production
      version: ${{ needs.build-production.outputs.version }}
      sentry_release: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # ====================================================================
  # MANUAL DISPATCH
  # action=build:  build a new image for the chosen destination, tag with
  #                <version>-<destination> and the rolling <destination> tag.
  #                Useful for bootstrap (first-ever staging/prod images
  #                before any release-please PR has been merged) and one-off
  #                rebuilds.
  # action=deploy: deploy an existing image at the given full tag to the
  #                chosen destination. The production environment's Required
  #                Reviewers rule still applies.
  # ====================================================================

  build-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ (inputs.version != '' && inputs.version) || github.sha }}-${{ inputs.destination }}
            type=raw,value=${{ inputs.destination }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-${{ inputs.destination }}

  deploy-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: ${{ inputs.destination }}
      version: ${{ inputs.version != '' && inputs.version || github.sha }}
    secrets: inherit
