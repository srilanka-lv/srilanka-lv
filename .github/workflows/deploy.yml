name: Build and deploy

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - build
          - deploy
        default: build
      destination:
        description: Destination
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: For action=build, the BASE version (will be suffixed with -<destination> in the image tag). For action=deploy, the FULL existing image tag to deploy. Defaults to HEAD SHA.
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ====================================================================
  # DEVELOPMENT FLOW
  # Push to `development` → build with SHA tag → deploy to development env
  # ====================================================================

  build-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    # Reference the development environment so vars.NEXT_PUBLIC_* resolve
    # to development values (baked into the image at build time).
    environment: development
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=development

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-development

  deploy-development:
    needs: build-development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: development
      version: ${{ needs.build-development.outputs.version }}
    secrets: inherit

  # ====================================================================
  # MAIN / RELEASE FLOW
  # Push to `main` → release-please. If a release PR is merged →
  #   build staging + production images in parallel (each with its own
  #   service label and per-env NEXT_PUBLIC_* values), then deploy
  #   staging → (approval) → deploy production.
  # ====================================================================

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  # After release-please commits the version bump + CHANGELOG to main, open a
  # PR to bring those same changes back to development. Without this, dev
  # accumulates "drift" each release (it never sees the version commit) and
  # future development → main PRs include surprise diffs.
  # Tries to auto-merge the PR (requires "Allow auto-merge" in repo Settings).
  # If auto-merge isn't enabled or branch protection blocks it, the PR stays
  # open for manual merge.
  backmerge-to-development:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Open backmerge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Skip if there's no diff between main and development (e.g. dev
          # already caught up some other way). gh exits 1 if no commits differ.
          if [ -z "$(git log origin/main ^origin/development --oneline)" ]; then
            echo "No commits on main that aren't on development — nothing to backmerge."
            exit 0
          fi

          pr_url=$(
            gh pr create \
              --base development \
              --head main \
              --title "chore: 🔄 backmerge main into development (release ${{ needs.release-please.outputs.tag_name }})" \
              --body "Auto-generated by the release flow. Brings the version bump + CHANGELOG from \`main\` back into \`development\`. Merging keeps dev in sync so the next \`development → main\` PR doesn't surprise you with already-released diffs." \
              2>&1
          ) || {
            # gh fails if a PR already exists for this branch combo — that's fine.
            echo "${pr_url}"
            echo "(probably already-open PR — skipping)"
            exit 0
          }
          echo "Opened: ${pr_url}"

          # Try to auto-merge. Requires "Allow auto-merge" in repo settings.
          # If it fails (not enabled, or branch protection requires checks
          # that haven't run yet), the PR stays open for manual merge.
          gh pr merge --auto --merge "${pr_url}" || \
            echo "Auto-merge not configured or blocked — PR left open for manual merge."

  build-staging:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Use the staging environment so vars.NEXT_PUBLIC_* resolve to staging values.
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-please.outputs.tag_name }}-staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}-staging
            type=raw,value=staging

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-staging

  build-production:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Use the production environment so vars.NEXT_PUBLIC_* resolve to production
    # values. Side effect: production env's Required Reviewers rule gates the
    # build — releases pause once for approval at this step.
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-please.outputs.tag_name }}-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}-production
            type=raw,value=production

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-production

  deploy-staging:
    needs: [release-please, build-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: staging
      version: ${{ needs.build-staging.outputs.version }}
      sentry_release: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  deploy-production:
    needs: [release-please, build-production, deploy-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: production
      version: ${{ needs.build-production.outputs.version }}
      sentry_release: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # ====================================================================
  # MANUAL DISPATCH
  # action=build:  build a new image for the chosen destination, tag with
  #                <version>-<destination> and the rolling <destination> tag.
  #                Useful for bootstrap (first-ever staging/prod images
  #                before any release-please PR has been merged) and one-off
  #                rebuilds.
  # action=deploy: deploy an existing image at the given full tag to the
  #                chosen destination. The production environment's Required
  #                Reviewers rule still applies.
  # ====================================================================

  build-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ (inputs.version != '' && inputs.version) || github.sha }}-${{ inputs.destination }}
            type=raw,value=${{ inputs.destination }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_STUDIO_DATASET=${{ vars.NEXT_PUBLIC_SANITY_STUDIO_DATASET }}
            NEXT_PUBLIC_SELF_URL=${{ vars.NEXT_PUBLIC_SELF_URL }}
            KAMAL_SERVICE=srilanka-${{ inputs.destination }}

  deploy-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    uses: ./.github/workflows/_kamal-deploy.yml
    with:
      destination: ${{ inputs.destination }}
      version: ${{ inputs.version != '' && inputs.version || github.sha }}
    secrets: inherit
