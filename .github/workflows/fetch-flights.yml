name: Fetch Flights Data

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  workflow_dispatch: # Allow manual triggers

jobs:
  fetch-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run fetch-flights script
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: bun run apps/web/src/features/serpapi/scripts/fetch-flights.ts

      - name: Map flight data
        run: bun run apps/web/src/features/serpapi/scripts/map-flights.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/serpapi/data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: ✈️ update flights data $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
